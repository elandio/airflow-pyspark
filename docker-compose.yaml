x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: airflow-pyspark:latest
  environment: &airflow-common-env
    
    PYTHONPATH: /opt/airflow/src
    PIPELINE_BASE_DIR: /opt/airflow/data_lake
    # DW (SQL Server do profile dw). Connection mssql_dw; a senha vem do .env
    AIRFLOW_CONN_MSSQL_DW: '{"conn_type": "mssql", "host": "sqlserver", "port": 1433, "login": "sa", "password": "${MSSQL_SA_PASSWORD:-}", "schema": "dw", "extra": {"encrypt": "true", "trustServerCertificate": "true"}}'

    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__FERNET_KEY: ''
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    
    - ./src:/opt/airflow/src
    
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./data_lake:/opt/airflow/data_lake
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config,data_lake}
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-admin}" \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config,data_lake}
        chmod -R 775 /opt/airflow/{logs,dags,plugins,config,data_lake}
    user: "0:0"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # --- DW de desenvolvimento (SQL Server) --------------------------------------------------
  # Só sobe com o profile: docker compose --profile dw up -d
  # Do Airflow: sqlserver:1433 | do Windows (SSMS/Azure Data Studio): localhost,1433
  # Usuário sa, senha MSSQL_SA_PASSWORD do .env. Banco dw e schema biz criados pelo sqlserver-init.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
    profiles: [dw]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env}
      MSSQL_MEMORY_LIMIT_MB: 2048
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: always

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
    profiles: [dw]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env}
    volumes:
      - ./docker/sqlserver/init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -i /init.sql"]
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-db-volume:
  sqlserver-data:
