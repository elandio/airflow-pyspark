[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflow-commons"
version = "0.3.0"
description = "Funções e padrões comuns das pipelines de dados"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "requests>=2"]          # requests: lnd.make_request_with_retries

[project.optional-dependencies]
spark = ["pyspark==3.5.3"]
formatos = ["pandas", "openpyxl"]      # leitura de XLSX e conversão pandas -> Spark

[tool.setuptools.packages.find]
include = ["dataflow_commons*"]
